<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitCA - Codebase Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e8ebf1;
            --bg-hi: #f4f6fa;
            --surface-top: #f1f3f8;
            --surface-bottom: #e3e7ee;
            --shadow-dark: #c5cad6;
            --shadow-light: #ffffff;
            --text: #2b3040;
            --muted: #7a8194;
            --accent: #5b6cff;
            --accent-dark: #4656e6;
            --green: #22b07d;
            --red: #e5566d;
            --radius: 22px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        .hidden { display: none !important; }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-hi), var(--bg) 60%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1040px; margin: 0 auto; padding: 40px 20px 60px; }

        /* ---------- Header ---------- */
        header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 36px; flex-wrap: wrap; gap: 16px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo {
            width: 48px; height: 48px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 20px;
            background: linear-gradient(145deg, #7482ff, var(--accent-dark));
            box-shadow:
                6px 6px 14px rgba(91,108,255,.35),
                -4px -4px 10px var(--shadow-light),
                inset 1px 1px 2px rgba(255,255,255,.45),
                inset -2px -2px 4px rgba(0,0,0,.18);
        }
        .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
        .brand p { font-size: 12px; color: var(--muted); margin-top: 2px; }

        .pill {
            display: inline-flex; align-items: center; gap: 9px;
            padding: 9px 16px; border-radius: 999px;
            font-size: 12px; font-weight: 500; color: var(--muted);
            background: var(--bg);
            box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
        }
        .led {
            width: 9px; height: 9px; border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #8ff5cb, var(--green));
            box-shadow: 0 0 8px 2px rgba(34,176,125,.55), inset -1px -1px 2px rgba(0,0,0,.2);
            animation: glow 2.4s ease-in-out infinite;
        }
        @keyframes glow { 50% { box-shadow: 0 0 3px 1px rgba(34,176,125,.35), inset -1px -1px 2px rgba(0,0,0,.2); } }

        /* ---------- Layout ---------- */
        .grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
        .grid > * { min-width: 0; }
        @media (min-width: 768px) { .grid { grid-template-columns: 340px minmax(0, 1fr); } }
        .stack { display: flex; flex-direction: column; gap: 28px; min-width: 0; }

        /* ---------- Raised card ---------- */
        .card {
            border-radius: var(--radius);
            padding: 26px;
            background: linear-gradient(145deg, var(--surface-top), var(--surface-bottom));
            box-shadow:
                12px 12px 28px var(--shadow-dark),
                -10px -10px 24px var(--shadow-light),
                inset 1px 1px 1px rgba(255,255,255,.7);
        }
        .card h2 {
            font-size: 15px; font-weight: 600; margin-bottom: 20px;
            display: flex; align-items: center; gap: 12px;
        }
        .step {
            width: 28px; height: 28px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: var(--accent);
            background: var(--bg);
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }

        label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

        /* ---------- Inset input ---------- */
        input[type="text"] {
            width: 100%; padding: 13px 16px;
            font: inherit; font-size: 14px; color: var(--text);
            background: var(--bg); border: none; border-radius: 14px; outline: none;
            box-shadow: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light);
            transition: box-shadow .2s;
        }
        input[type="text"]::placeholder { color: #a3a9b9; }
        input[type="text"]:focus {
            box-shadow: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light), 0 0 0 2px rgba(91,108,255,.35);
        }

        /* ---------- Tactile buttons ---------- */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 9px;
            padding: 13px 22px; border: none; border-radius: 14px; cursor: pointer;
            font: inherit; font-size: 14px; font-weight: 600; color: #fff;
            transition: transform .12s, box-shadow .12s, filter .15s;
        }
        .btn-primary {
            width: 100%; margin-top: 18px;
            background: linear-gradient(160deg, #7684ff, var(--accent-dark));
            box-shadow:
                6px 6px 14px rgba(91,108,255,.38),
                -5px -5px 12px var(--shadow-light),
                inset 1px 1px 1px rgba(255,255,255,.45),
                inset -1px -2px 3px rgba(0,0,0,.2);
            text-shadow: 0 1px 1px rgba(0,0,0,.2);
        }
        .btn-green {
            background: linear-gradient(160deg, #3cc995, #1a9a6c);
            box-shadow:
                6px 6px 14px rgba(34,176,125,.35),
                -5px -5px 12px var(--shadow-light),
                inset 1px 1px 1px rgba(255,255,255,.45),
                inset -1px -2px 3px rgba(0,0,0,.2);
            text-shadow: 0 1px 1px rgba(0,0,0,.2);
        }
        .btn:hover { filter: brightness(1.05); }
        .btn:active {
            transform: translateY(1px);
            box-shadow: inset 4px 4px 9px rgba(0,0,0,.28), inset -2px -2px 6px rgba(255,255,255,.12);
        }
        .btn:disabled { opacity: .65; cursor: wait; }

        /* ---------- Status ---------- */
        .status {
            display: block; margin-top: 18px; padding: 13px 15px;
            border-radius: 14px; font-size: 12px; line-height: 1.55;
            background: var(--bg);
            box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
            border-left: 3px solid transparent;
            word-break: break-word;
        }
        .status.info { color: var(--accent-dark); border-left-color: var(--accent); }
        .status.success { color: #168a60; border-left-color: var(--green); }
        .status.error { color: #c23a52; border-left-color: var(--red); }

        /* ---------- Active repo ---------- */
        .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
        .row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; margin-bottom: 10px; border-radius: 12px; font-size: 13px;
            background: var(--bg);
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
        }
        .row:last-child { margin-bottom: 0; }
        .row span:first-child { color: var(--muted); }
        .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; font-weight: 500; }
        .accent { color: var(--accent); }

        /* ---------- Samples ---------- */
        .ask-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
        .samples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
        .sample-q {
            border: none; cursor: pointer; font: inherit; font-size: 12px; color: var(--accent-dark);
            padding: 7px 12px; border-radius: 999px; background: linear-gradient(145deg, var(--surface-top), var(--surface-bottom));
            box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
            transition: all .12s;
        }
        .sample-q:hover { color: var(--accent); }
        .sample-q:active { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); }

        /* ---------- Answer ---------- */
        .answer-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
        .answer-head h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .answer-head h3 i { color: var(--green); }

        .tabs {
            display: inline-flex; padding: 5px; border-radius: 14px; gap: 4px;
            background: var(--bg);
            box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
        }
        .tab {
            border: none; cursor: pointer; font: inherit; font-size: 12px; font-weight: 500;
            padding: 8px 14px; border-radius: 10px; background: transparent; color: var(--muted);
            transition: all .15s;
        }
        .tab:hover { color: var(--text); }
        .tab.active {
            color: var(--accent-dark); font-weight: 600;
            background: linear-gradient(145deg, var(--surface-top), var(--surface-bottom));
            box-shadow: 3px 3px 7px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
        }

        .well {
            border-radius: 16px; padding: 20px;
            background: var(--bg);
            box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
        }

        .prose { font-size: 14px; line-height: 1.75; }
        .prose > * + * { margin-top: 12px; }
        .prose h1, .prose h2, .prose h3, .prose h4 { font-weight: 600; letter-spacing: -0.01em; margin-top: 20px; }
        .prose h1 { font-size: 19px; } .prose h2 { font-size: 17px; } .prose h3 { font-size: 15px; }
        .prose ul, .prose ol { padding-left: 22px; }
        .prose li + li { margin-top: 4px; }
        .prose a { color: var(--accent); }
        .prose strong { font-weight: 600; }
        .prose code {
            font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px;
            color: var(--accent-dark); background: rgba(91,108,255,.1); padding: 2px 6px; border-radius: 6px;
        }
        .prose pre {
            background: linear-gradient(160deg, #2a3042, #1d2232); color: #e7ebf7;
            padding: 16px 18px; border-radius: 14px; overflow-x: auto;
            box-shadow: inset 2px 2px 6px rgba(0,0,0,.45), 0 1px 0 var(--shadow-light);
        }
        .prose pre code { background: none; color: inherit; padding: 0; }
        .well { min-width: 0; overflow-x: auto; overflow-wrap: anywhere; }
        .prose table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            font-size: 13px; line-height: 1.55; table-layout: auto;
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 0 0 1px rgba(140,150,175,.28);
        }
        .prose th {
            text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
            color: var(--muted); padding: 10px 12px;
            background: linear-gradient(145deg, var(--surface-top), var(--surface-bottom));
            border-bottom: 1px solid rgba(140,150,175,.3);
        }
        .prose td {
            padding: 10px 12px; vertical-align: top; min-width: 90px;
            border-bottom: 1px solid rgba(140,150,175,.18);
            overflow-wrap: anywhere; word-break: break-word;
        }
        .prose tr:last-child td { border-bottom: none; }
        .prose td code, .prose th code {
            white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; display: inline;
        }
        .prose img { max-width: 100%; }
        .loading { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
        .loading i { color: var(--green); }
        .err { color: #c23a52; font-size: 13px; word-break: break-word; }

        pre.json {
            font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; line-height: 1.6;
            max-height: 384px; overflow: auto; padding: 18px; border-radius: 16px;
            background: linear-gradient(160deg, #2a3042, #1d2232);
            box-shadow: inset 3px 3px 9px rgba(0,0,0,.5), 0 1px 0 var(--shadow-light);
        }
        #graphJson { color: #a8b3ff; }
        #vectorJson { color: #7ee3bd; }

        /* ---------- Eye tracking ---------- */
        .eyes-hero { display: flex; justify-content: center; margin: 0 0 40px; }
        .eyes { display: flex; align-items: center; justify-content: center; }
        .eye {
            position: relative; border-radius: 50%; flex: none;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 35% 28%, #ffffff 0%, #f3f5fa 55%, #dfe3ec 100%);
            box-shadow:
                12px 12px 26px var(--shadow-dark),
                -10px -10px 24px var(--shadow-light),
                inset -5px -7px 14px rgba(120,130,160,.28),
                inset 4px 5px 10px rgba(255,255,255,.9);
            transition: transform .14s ease-in;
            will-change: transform;
        }
        .eye.blink { transform: scaleY(.08); }
        .iris {
            position: relative; border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #8b97ff 0%, var(--accent) 45%, #2f3bb8 100%);
            box-shadow: inset 0 0 0 3px rgba(35,45,140,.35), 2px 3px 6px rgba(40,50,110,.35);
            display: flex; align-items: center; justify-content: center;
            transition: transform .09s ease-out;
            will-change: transform;
        }
        .pupil {
            width: 46%; height: 46%; border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #2b3040, #0b0d16);
            box-shadow: inset 1px 1px 3px rgba(255,255,255,.18);
            transition: transform .35s cubic-bezier(.3,1.4,.5,1);
        }
        .iris::after {
            content: ""; position: absolute; top: 16%; left: 22%;
            width: 22%; height: 22%; border-radius: 50%;
            background: rgba(255,255,255,.88); filter: blur(.4px);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(140,150,175,.45); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="logo"><i class="fa-solid fa-diagram-project"></i></div>
                <div>
                    <h1>GitCA</h1>
                    <p>Knowledge Graph + Vector Hybrid Code Retrieval</p>
                </div>
            </div>
            <span class="pill"><span class="led"></span>Neo4j + Groq Active</span>
        </header>

        <!-- Eye tracking (vanilla port of <EyeTracking eyeSize={140} gap={50} />) -->
        <section class="eyes-hero"><div id="eyeTracking" class="eyes" data-eye-size="140" data-gap="50"></div></section>

        <div class="grid">
            <!-- Left Column -->
            <div class="stack">
                <div class="card">
                    <h2><span class="step">1</span> Ingest Repository</h2>
                    <form id="ingestForm">
                        <label for="repoUrl">GitHub URL or Owner/Repo</label>
                        <input type="text" id="repoUrl" placeholder="https://github.com/facebook/react" required />
                        <button type="submit" id="ingestBtn" class="btn btn-primary">
                            <i class="fa-solid fa-cloud-arrow-down"></i>
                            <span>Ingest &amp; Index</span>
                        </button>
                    </form>
                    <div id="ingestStatus" class="hidden"></div>
                </div>

                <div id="activeRepoCard" class="card hidden">
                    <div class="eyebrow">Active Knowledge Context</div>
                    <div class="row"><span>Owner</span><span id="activeOwner" class="mono accent">-</span></div>
                    <div class="row"><span>Repo</span><span id="activeRepo" class="mono accent">-</span></div>
                    <div class="row"><span>Indexed Files</span><span id="activeFiles" class="mono">-</span></div>
                    <div class="row"><span>Commits</span><span id="activeCommits" class="mono">-</span></div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="stack">
                <div class="card">
                    <h2><span class="step">2</span> Ask Questions</h2>
                    <form id="askForm">
                        <input type="text" id="questionInput" placeholder="e.g. Where is authentication implemented and which functions are called?" required />
                        <div class="ask-footer">
                            <div class="samples">
                                <span>Try:</span>
                                <button type="button" class="sample-q">Where is authentication implemented?</button>
                                <button type="button" class="sample-q">What functions are called by login?</button>
                            </div>
                            <button type="submit" id="askBtn" class="btn btn-green">
                                <i class="fa-solid fa-paper-plane"></i>
                                <span>Ask RAG</span>
                            </button>
                        </div>
                    </form>
                </div>

                <div id="answerSection" class="card hidden">
                    <div class="answer-head">
                        <h3><i class="fa-solid fa-robot"></i> AI Answer</h3>
                        <div class="tabs" id="contextTabs">
                            <button id="tabAnswer" class="tab active">Answer</button>
                            <button id="tabGraph" class="tab">Graph (<span id="graphCount">0</span>)</button>
                            <button id="tabVector" class="tab">Vector (<span id="vectorCount">0</span>)</button>
                        </div>
                    </div>

                    <div id="answerContent" class="well prose"></div>

                    <div id="graphContent" class="hidden">
                        <pre id="graphJson" class="json"></pre>
                    </div>

                    <div id="vectorContent" class="hidden">
                        <pre id="vectorJson" class="json"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentOwner = "facebook";
        let currentRepo = "react";

        // If opened via Live Server (e.g. port 5500) or file://, direct requests to backend port 5000
        const API_BASE = (window.location.protocol === "file:" || !window.location.origin.includes(":5000"))
            ? "http://localhost:5000"
            : "";

        const repoUrlInput = document.getElementById("repoUrl");
        const ingestForm = document.getElementById("ingestForm");
        const ingestBtn = document.getElementById("ingestBtn");
        const ingestStatus = document.getElementById("ingestStatus");

        const activeRepoCard = document.getElementById("activeRepoCard");
        const activeOwner = document.getElementById("activeOwner");
        const activeRepo = document.getElementById("activeRepo");
        const activeFiles = document.getElementById("activeFiles");
        const activeCommits = document.getElementById("activeCommits");

        const askForm = document.getElementById("askForm");
        const questionInput = document.getElementById("questionInput");
        const askBtn = document.getElementById("askBtn");
        const answerSection = document.getElementById("answerSection");
        const answerContent = document.getElementById("answerContent");
        const graphJson = document.getElementById("graphJson");
        const vectorJson = document.getElementById("vectorJson");
        const graphCount = document.getElementById("graphCount");
        const vectorCount = document.getElementById("vectorCount");

        // Ingestion Handler
        ingestForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const url = repoUrlInput.value.trim();
            if (!url) return;

            ingestBtn.disabled = true;
            ingestBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Ingesting...`;
            ingestStatus.className = "status info";
            ingestStatus.innerHTML = `Cloning repository and indexing AST code entities, graph relations, and vector embeddings... This may take a moment.`;

            try {
                const res = await fetch(`${API_BASE}/api/rag/ingest`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url })
                });

                const rawText = await res.text();
                let data;
                try {
                    data = JSON.parse(rawText);
                } catch (e) {
                    throw new Error(rawText || `Server error (HTTP ${res.status}: ${res.statusText})`);
                }

                if (!res.ok || !data.success) {
                    throw new Error(data.error || "Ingestion failed");
                }

                currentOwner = data.owner;
                currentRepo = data.repo;

                activeOwner.textContent = data.owner;
                activeRepo.textContent = data.repo;
                activeFiles.textContent = data.graphStats?.filesFound || data.vectorStats?.indexedFiles || 0;
                activeCommits.textContent = data.graphStats?.commitsFound || 0;
                activeRepoCard.classList.remove("hidden");

                ingestStatus.className = "status success";
                ingestStatus.innerHTML = `<i class="fa-solid fa-check"></i> Successfully ingested <strong>${data.owner}/${data.repo}</strong> (${data.graphStats?.filesFound || 0} files, ${data.graphStats?.commitsFound || 0} commits). You can now ask questions!`;
            } catch (err) {
                ingestStatus.className = "status error";
                ingestStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${err.message}`;
            } finally {
                ingestBtn.disabled = false;
                ingestBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-down"></i> <span>Ingest &amp; Index</span>`;
            }
        });

        // Question Handler
        askForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const question = questionInput.value.trim();
            if (!question) return;

            askBtn.disabled = true;
            askBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Searching...`;
            answerSection.classList.remove("hidden");
            setTab(tabAnswer);
            answerContent.innerHTML = `<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Querying Neo4j knowledge graph &amp; vector store, reasoning with LLM...</div>`;

            try {
                const url = repoUrlInput.value.trim();
                const payload = url
                    ? { url, question }
                    : { owner: currentOwner, repo: currentRepo, question };

                const res = await fetch(`${API_BASE}/api/rag/ask`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const rawText = await res.text();
                let data;
                try {
                    data = JSON.parse(rawText);
                } catch (e) {
                    throw new Error(rawText || `Server error (HTTP ${res.status}: ${res.statusText})`);
                }

                if (!res.ok || !data.success) {
                    throw new Error(data.error || "RAG query failed");
                }

                answerContent.innerHTML = marked.parse(data.answer || "No answer returned.");
                graphJson.textContent = JSON.stringify(data.context?.graph || [], null, 2);
                vectorJson.textContent = JSON.stringify(data.context?.vector || [], null, 2);
                graphCount.textContent = (data.context?.graph || []).length;
                vectorCount.textContent = (data.context?.vector || []).length;
            } catch (err) {
                answerContent.innerHTML = `<div class="err"><i class="fa-solid fa-triangle-exclamation"></i> ${err.message}</div>`;
            } finally {
                askBtn.disabled = false;
                askBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Ask RAG</span>`;
            }
        });

        // Sample Questions
        document.querySelectorAll(".sample-q").forEach(btn => {
            btn.addEventListener("click", () => {
                questionInput.value = btn.textContent;
                askForm.dispatchEvent(new Event("submit"));
            });
        });

        // Tabs
        const tabAnswer = document.getElementById("tabAnswer");
        const tabGraph = document.getElementById("tabGraph");
        const tabVector = document.getElementById("tabVector");

        function setTab(active) {
            [tabAnswer, tabGraph, tabVector].forEach(t => t.classList.toggle("active", t === active));
            answerContent.classList.toggle("hidden", active !== tabAnswer);
            document.getElementById("graphContent").classList.toggle("hidden", active !== tabGraph);
            document.getElementById("vectorContent").classList.toggle("hidden", active !== tabVector);
        }

        tabAnswer.onclick = () => setTab(tabAnswer);
        tabGraph.onclick = () => setTab(tabGraph);
        tabVector.onclick = () => setTab(tabVector);

        // Eye tracking: pupils follow the cursor, with blink + dilation
        (function initEyeTracking() {
            const host = document.getElementById("eyeTracking");
            let eyeSize = Number(host.dataset.eyeSize) || 140;
            let gap = Number(host.dataset.gap) || 50;

            // Shrink on narrow screens so both eyes always fit
            const avail = Math.min(window.innerWidth - 40, 1000);
            const needed = eyeSize * 2 + gap;
            if (needed > avail) {
                const k = avail / needed;
                eyeSize = Math.round(eyeSize * k);
                gap = Math.round(gap * k);
            }

            host.style.gap = gap + "px";
            const irisSize = eyeSize * 0.48;
            const maxTravel = (eyeSize - irisSize) / 2 - eyeSize * 0.05;

            const eyes = [0, 1].map(() => {
                const eye = document.createElement("div");
                eye.className = "eye";
                eye.style.width = eye.style.height = eyeSize + "px";
                const iris = document.createElement("div");
                iris.className = "iris";
                iris.style.width = iris.style.height = irisSize + "px";
                const pupil = document.createElement("div");
                pupil.className = "pupil";
                iris.appendChild(pupil);
                eye.appendChild(iris);
                host.appendChild(eye);
                return { eye, iris, pupil };
            });

            function look(x, y) {
                eyes.forEach(({ eye, iris, pupil }) => {
                    const r = eye.getBoundingClientRect();
                    const dx = x - (r.left + r.width / 2);
                    const dy = y - (r.top + r.height / 2);
                    const dist = Math.hypot(dx, dy);
                    const travel = maxTravel * Math.min(1, dist / (eyeSize * 1.1));
                    const angle = Math.atan2(dy, dx);
                    iris.style.transform = `translate(${Math.cos(angle) * travel}px, ${Math.sin(angle) * travel}px)`;
                    // Dilate when the cursor is close
                    pupil.style.transform = `scale(${dist < eyeSize * 1.6 ? 1.3 : 1})`;
                });
            }

            function center() {
                eyes.forEach(({ iris, pupil }) => {
                    iris.style.transform = "translate(0, 0)";
                    pupil.style.transform = "scale(1)";
                });
            }

            window.addEventListener("pointermove", e => look(e.clientX, e.clientY));
            document.addEventListener("pointerleave", center);

            function blink() {
                eyes.forEach(({ eye }) => eye.classList.add("blink"));
                setTimeout(() => eyes.forEach(({ eye }) => eye.classList.remove("blink")), 140);
                setTimeout(blink, 2500 + Math.random() * 3500);
            }
            setTimeout(blink, 2000);
        })();
    </script>
</body>
</html>
